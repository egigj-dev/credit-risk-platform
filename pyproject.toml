[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-platform"
version = "0.1.0"
description = "Credit-risk PD, NPL, and next-best-offer MVP"
requires-python = ">=3.10,<3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "psycopg2-binary>=2.9,<3",
]

[project.optional-dependencies]
ml = [
  "numpy==1.26.4", "pandas==2.2.2", "scikit-learn==1.7.2",
  "xgboost>=2.0", "lightgbm==4.3.0", "catboost>=1.2",
  "shap>=0.44", "optuna>=3.6", "mlflow==3.11.1", "joblib>=1.3",
]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
credit-risk = "credit_risk.cli:main"
credit-risk-full = "credit_risk.production_cli:main"
credit-risk-model = "credit_risk.full_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"src/credit_risk/core/database.py" = ["DTZ011"]
"src/credit_risk/full_cli.py" = ["DTZ011"]
