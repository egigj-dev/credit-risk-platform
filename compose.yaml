services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: credit_risk_db_v2
      POSTGRES_USER: credit_risk_app
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_risk_app -d credit_risk_db_v2"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - credit-risk-postgres:/var/lib/postgresql/data

volumes:
  credit-risk-postgres:
